services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-users:
    image: mongo:6.0
    platform: linux/arm64
    volumes:
      - mongo_users:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-products:
    image: mongo:6.0
    platform: linux/arm64
    volumes:
      - mongo_products:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-orders:
    image: mongo:6.0
    platform: linux/arm64
    volumes:
      - mongo_orders:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    environment:
      GRPC_PORT: 50051
      MONGO_URI: mongodb://mongo-users:27017/users
      JWT_SECRET: supersecretkey
      JWT_EXPIRES_IN: 7d
    depends_on:
      mongo-users:
        condition: service_healthy

  product-service:
    build:
      context: .
      dockerfile: services/product-service/Dockerfile
    environment:
      GRPC_PORT: 50052
      MONGO_URI: mongodb://mongo-products:27017/products
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo-products:
        condition: service_healthy

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    environment:
      GRPC_PORT: 50053
      MONGO_URI: mongodb://mongo-orders:27017/orders
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo-orders:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      FROM_EMAIL: noreply@ecommerce.com
    depends_on:
      rabbitmq:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      USER_SERVICE_URL: user-service:50051
      PRODUCT_SERVICE_URL: product-service:50052
      ORDER_SERVICE_URL: order-service:50053
    depends_on:
      - user-service
      - product-service
      - order-service

volumes:
  mongo_users:
  mongo_products:
  mongo_orders:
